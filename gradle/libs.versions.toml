# One catalog for both builds (core/ and android/). Each settings.gradle.kts imports it.
[versions]
# 2.1.21 (Phase 11 F4): the Kotlin Paparazzi 2.0.0-alpha02 and Compose 1.8.3 are built with.
kotlin = "2.1.21"
# 8.9.1 was the oldest AGP androidx.core 1.17 accepts (Phase 10 D10). 8.10.1 (Phase 11 F4): Paparazzi 2.0.0-alpha02's
# plugin calls AGP 8.10's sdklib (8.9.1 fails at configuration: AndroidVersion.compareTo(int, String)).
agp = "8.10.1"
coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "4.12.0"
leakcanary = "2.14"
junit = "4.13.2"
# 2025.06.01 = Compose 1.8.3 (Phase 11 F4). 1.8 computes a node's semantics eagerly on the main thread when they
# change (ComposeUiFlags.isSemanticAutofillEnabled, default on), so a test-thread read no longer runs the snapshot
# observer: the Settings-dialog race of F2 (ui-testing skill). 1.8.3 is the Compose Paparazzi 2.0.0-alpha02 is built on.
composeBom = "2025.06.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
# 1.17.0: NotificationCompat.ProgressStyle + setRequestPromotedOngoing (Live Updates); needs compileSdk 36.
coreKtx = "1.17.0"
maplibre = "11.8.0"
playLocation = "21.3.0"
datastore = "1.1.1"
# On-device UI tests (android/app/src/androidTest), run by .github/workflows/ui-tests.yml.
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"
uiautomator = "2.3.0"
atf = "4.1.1"
# Screenshot tests without an emulator. 2.0.0-alpha02 (Phase 11 F4): layoutlib API 36, Compose 1.8.3, like this build.
# 1.3.5 cannot render Compose 1.8+ (F2). There is no stable 2.x; alpha03-05 need Compose 1.10+ / Kotlin 2.3.
paparazzi = "2.0.0-alpha02"
# Paparazzi brings Guava 33.3.1 onto the unit-test classpath: GHSA-xxph-c9ww-hj94 (CVSS 8.2), fixed in 33.7.2.
guavaTest = "33.7.2-jre"
# Night refresh (Phase 9 C2). 2.9.1: compileSdk 34+, like this build.
# 2.10.5 (Phase 11 F2): a full disk makes WorkManager's own database throw SQLiteFullException at start-up;
# TransitApp routes it to an initialization exception handler instead of ending the app.
work = "2.10.5"
# Style gate (Phase 11 T2, owner decision 17): ktlint via its Gradle plugin; findings are gated per changed line (tools/ktlint_gate.py).
ktlintPlugin = "12.1.2"
# Core test foundation (Phase 11 T1): line-coverage gate on core; property tests (standalone, from JUnit 4).
kover = "0.9.1"
kotest = "5.9.1"
# Mutation testing (Phase 11 T5, owner decision 20): PIT (Apache-2.0, JUnit 4) through its Gradle plugin; tools/mutation_score.py gates per class.
pitestPlugin = "1.15.0"
pitestEngine = "1.17.4"

