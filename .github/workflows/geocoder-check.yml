# THROWAWAY (scratch branch claude/geocoder-check): what Android's built-in Geocoder answers
# for the owner's home on google_apis emulators. Logs only; nothing is asserted.
name: Geocoder check

on:
  push:
    branches: [claude/geocoder-check]
  workflow_dispatch:

jobs:
  check:
    name: Geocoder on API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p android :app:assembleUitest :app:assembleUitestAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/uitest/app-uitest.apk
            adb install -r android/app/build/outputs/apk/androidTest/uitest/app-uitest-androidTest.apk
            sleep 30
            adb logcat -c
            adb shell am instrument -w -r -e class il.transit.planner.uitest.GeocoderCheck il.transit.planner.uitest.test/androidx.test.runner.AndroidJUnitRunner
            echo "===== GeoCheck log ====="
            adb logcat -d -s GeoCheck:I
