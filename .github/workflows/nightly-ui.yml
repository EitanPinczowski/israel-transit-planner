# Phase 11 T7: the chaos steps that need root or are slow, once a night (01:47 Israel winter time,
# 02:47 in summer) and only when `main` changed since the last good run: app standby buckets,
# time zone + DST, clock skew, low storage, a freeform window, pseudolocales (en-XA, ar-XB) on two
# phone profiles, and the long monkey (3 seeds x 20000 events). Free: standard runners, replayed
# fixtures, nothing reaches Transitous. A failure comments on the open issue "nightly".
# See .claude/skills/ui-testing.
name: Nightly UI chaos

on:
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ui
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed:
    name: has main changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    permissions: { contents: read, actions: read }
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ${{ github.event_name }} == workflow_dispatch ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow nightly-ui.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          echo "last good nightly: ${last:-none}; main: $GITHUB_SHA"
          if [[ "$last" == "$GITHUB_SHA" ]]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  build:
    name: build uitest APKs
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p android :app:assembleUitest :app:assembleUitestAndroidTest
      - run: |
          mkdir apks
          cp android/app/build/outputs/apk/uitest/app-uitest.apk apks/
          cp android/app/build/outputs/apk/androidTest/uitest/app-uitest-androidTest.apk apks/
      - uses: actions/upload-artifact@v4
        with: { name: uitest-apks, path: apks/, retention-days: 3 }

  chaos:
    name: ${{ matrix.mode }} on API 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [chaos, monkey]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: sysimg-35-google_apis-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -skin 2400x2400
          script: bash tools/ui_chaos_run.sh ${{ matrix.mode }} 35 apks out/${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.mode }}
          path: out/
          retention-days: 7

  # Phase 11 T8: performance REPORTS, no gate yet (numbers in the job summary; the trend table is docs/testing/perf.md,
  # updated by the boss at close-out). `jank`: a scripted pan / zoom over the drawn route, dumpsys gfxinfo. `ride`: a 30-minute
  # simulated ride on a GPX fed with `adb emu geo fix`, dumpsys batterystats. A loose gate only after 2 weeks of numbers.
  perf:
    name: ${{ matrix.mode }} report on API 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        mode: [jank, ride]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: sysimg-35-google_apis-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ui_perf_run.sh ${{ matrix.mode }} 35 apks out/perf-${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-perf-${{ matrix.mode }}
          path: out/
          retention-days: 14

  report:
    name: comment on the nightly issue
    needs: [chaos, perf]
    if: failure()
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          find() { gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"nightly" in:title' --json number,title --jq '[.[] | select(.title == "nightly")][0].number'; }
          issue=$(find)
          if [[ -z $issue || $issue == null ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly" --body "Failures of the nightly UI chaos run (nightly-ui.yml) are commented here." >/dev/null
            issue=$(find)
          fi
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "The nightly chaos run failed on \`${GITHUB_SHA::7}\`: [run $GITHUB_RUN_ID]($run)"
