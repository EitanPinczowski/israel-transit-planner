name: Mutation

# Phase 11 T5 (owner decision 20): PIT on the pure packages (present, fare, features, remind, ride, calendar, plan/TripPages).
# Weekly: the full run (~45 min), which raises core/mutation-baseline.json and never lowers it.
# workflow_dispatch: the same run; `write_baseline` writes the first baseline instead (committed to the ref it ran on).
# The per-PR gate on changed classes is the `mutation` job in ci.yml.
on:
  push:   # TEMPORARY (T5 first run, removed again): a workflow not on main cannot be dispatched
    branches: [claude/p11-t5-first-run]
  schedule:
    - cron: "17 21 * * 0"   # Sunday night UTC = Monday 00:17 Israel in summer time
  workflow_dispatch:
    inputs:
      write_baseline:
        description: "Write a fresh baseline (first run); otherwise raise it"
        type: boolean
        default: false

permissions: { contents: write, issues: write }

concurrency: { group: mutation, cancel-in-progress: false }

jobs:
  full:
    name: full mutation run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: PIT (all target packages)
        run: ./gradlew -p core pitest --console=plain
      - name: Scores
        run: |
          python3 tools/mutation_score.py gate core/build/reports/pitest/mutations.xml | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-report
          path: core/build/reports/pitest
          retention-days: 30
      - name: Write or raise the baseline
        run: |
          if [ "${{ inputs.write_baseline }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            python3 tools/mutation_score.py write core/build/reports/pitest/mutations.xml
          else
            python3 tools/mutation_score.py raise core/build/reports/pitest/mutations.xml
          fi
      - name: Commit the baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/mutation-baseline.json
          if git diff --cached --quiet; then echo "baseline unchanged"; exit 0; fi
          git commit -m "Mutation baseline: ${{ inputs.write_baseline && 'first run' || 'weekly raise' }}"
          # A protected main refuses the push: the artifact above holds the report, and the owner merges the file by hand.
          git push || echo "::warning::could not push the baseline (protected branch?); take core/mutation-baseline.json from this run's log"
