name: gates-bootstrap
on:
  push:
    branches: [scratch/p11-baselines]
jobs:
  measure:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: lint (creates the baseline)
        continue-on-error: true
        run: ./gradlew -p android :app:lintDebug
      - run: ls -la android/app/lint-baseline.xml
      - run: ./gradlew -p android :app:lintDebug
      - run: ./gradlew -p android :app:ktlintCheck
      - run: python3 tools/ktlint_gate.py --write-baseline
      - run: ./gradlew -p android :app:assembleRelease
      - run: python3 tools/apk_size.py android/app/build/outputs/apk/release/app-release-unsigned.apk --write --commit "${GITHUB_SHA}"
      - run: python3 tools/lint_summary.py android/app/build/reports/lint-results-debug.xml --baseline android/app/lint-baseline.xml
      - name: push results
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/lint-baseline.xml apk-size.json tools/ktlint-baseline.json
          git commit -m "bootstrap results" && git push origin HEAD:scratch/p11-baselines-out --force
