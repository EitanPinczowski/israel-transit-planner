name: gen userdata sample (temporary)
on:
  workflow_dispatch:
  push:
    branches: [claude/userdata-sample-0.9.2]
    paths: [.github/workflows/gen-sample-tmp.yml]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: tools/gen_userdata_sample.sh v0.9.2
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/test/resources/fixtures/userdata/0.9.2.json
          git commit -m "Add v0.9.2 saved-data sample (generated from the v0.9.2 tag's codec)"
          git push origin HEAD:claude/userdata-sample-0.9.2
