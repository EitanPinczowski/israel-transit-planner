# The app on emulators: every screen on 9 phone profiles (size, density, font scale,
# Hebrew/English, light/dark, nav mode, cutout, landscape) with a layout audit, and the
# user journeys on Android 8, 10, 13, 14 and 15 (16: the Live Update journeys only). The `uitest` build answers from recorded
# fixtures, so this sends nothing to Transitous or OpenFreeMap.
#
# Free: standard GitHub-hosted runners (public repo). Never switch to "larger runners".
# Results: the `ci-screens` branch (README.md = findings, screens.md = every screenshot).
# See .claude/skills/ui-testing.
name: UI tests

on:
  push:
    branches-ignore: [ci-screens, "corpus-run/**"]
    paths:
      - "android/**"
      - "core/src/main/**"
      - "core/src/test/resources/fixtures/**"
      - "gradle/**"
      - "tools/ui_*"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/src/main/**"
      - "core/src/test/resources/fixtures/**"
      - "gradle/**"
      - "tools/ui_*"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build uitest APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p android :app:assembleUitest :app:assembleUitestAndroidTest
      - run: |
          mkdir apks
          cp android/app/build/outputs/apk/uitest/app-uitest.apk apks/
          cp android/app/build/outputs/apk/androidTest/uitest/app-uitest-androidTest.apk apks/
      - uses: actions/upload-artifact@v4
        with: { name: uitest-apks, path: apks/, retention-days: 3 }

  layout:
    name: screens on phone profiles (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read, issues: write } # issues: the flake log step only
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system image comes from Google's servers; a broken download once failed a whole
      # job. Cached per API level, so most runs never download it.
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: sysimg-35-google_apis-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A screen big enough for every profile: wm size only shrinks it (tools/ui_layout_run.sh).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -skin 2400x2400
          script: bash tools/ui_layout_run.sh ${{ matrix.shard }} apks out/layout-${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-${{ matrix.shard }}
          path: out/
          retention-days: 7
      # Not for a cancelled job (a newer push cancels it): its half-run tests are not failures (F3, tools/ui_flake_log.sh).
      - if: always() && !cancelled()
        name: Flake log
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ui_flake_log.sh out "screens shard ${{ matrix.shard }}"

  behaviour:
    name: journeys on API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read, issues: write } # issues: the flake log step only
    strategy:
      fail-fast: false
      matrix:
        # 36: Android 16, the ride and countdown journeys only (Live Updates, Phase 10 D10).
        api: [26, 29, 33, 34, 35, 36]
        # Android 8 runs the plain AOSP image (lighter). Its SystemUI crash over the lock
        # screen is handled in tools/ui_behaviour_run.sh.
        target: [google_apis]
        exclude:
          - api: 26
            target: google_apis
        include:
          - api: 26
            target: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}
          key: sysimg-${{ matrix.api }}-${{ matrix.target }}-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ui_behaviour_run.sh ${{ matrix.api }} apks out/behaviour-${{ matrix.api }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-${{ matrix.api }}
          path: out/
          retention-days: 7
      # Not for a cancelled job (a newer push cancels it): its half-run tests are not failures (F3, tools/ui_flake_log.sh).
      - if: always() && !cancelled()
        name: Flake log
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ui_flake_log.sh out "journeys API ${{ matrix.api }}"

  # Phase 11 T7: what the phone does to the app (Doze, reboot, airplane, rotation / theme / language
  # mid-flow, location revoked mid-ride, process death in every tab). One API 34 emulator, parallel
  # to the shards. The slow and root-only chaos steps run nightly (nightly-ui.yml).
  system:
    name: system journeys on API 34
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write } # issues: the flake log step only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34
          key: sysimg-34-google_apis-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ui_system_run.sh 34 apks out/system-34
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-34
          path: out/
          retention-days: 7
      # Not for a cancelled job (a newer push cancels it): its half-run tests are not failures (F3, tools/ui_flake_log.sh).
      - if: always() && !cancelled()
        name: Flake log
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ui_flake_log.sh out "system API 34"

  faults:
    name: network-fault matrix on API 35
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: read, issues: write } # issues: the flake log step only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      # Phase 11 T6: the in-app update test installs a "next version" over this one. Built here (versionCode 2,
      # versionName 0.0.2-uitest); Android only updates an app signed with the same key, so all three APKs
      # (the downloaded pair and this one) are re-signed with one throwaway key made in the job.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the next uitest APK and sign all three with one key
        env: { RELEASE_VERSION: "0.0.2" }
        run: |
          ./gradlew -p android :app:assembleUitest
          cp android/app/build/outputs/apk/uitest/app-uitest.apk apks/app-uitest-next.apk
          # A throwaway key made here (never committed, never a secret); the three APKs must share one.
          keytool -genkeypair -keystore "$RUNNER_TEMP/t6.jks" -storepass t6-throwaway -keypass t6-throwaway \
            -alias t6 -keyalg RSA -keysize 2048 -validity 2 -dname "CN=T6 uitest throwaway"
          signer="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in apks/app-uitest.apk apks/app-uitest-androidTest.apk apks/app-uitest-next.apk; do
            "$signer" sign --ks "$RUNNER_TEMP/t6.jks" --ks-pass pass:t6-throwaway --ks-key-alias t6 --key-pass pass:t6-throwaway "$apk"
          done
          for apk in apks/*.apk; do echo "$apk: $("$signer" verify --print-certs "$apk" | grep -m1 SHA-256)"; done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: sysimg-35-google_apis-x86_64-v1
      # Phase 11 T4: every networked screen against a local MockWebServer (the emulator's loopback,
      # never the internet) under 429 / 503 / timeout / garbage / empty / {} / cut / offline.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ui_faults_run.sh 35 apks out/faults-35
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faults-35
          path: out/
          retention-days: 7
      # Not for a cancelled job (a newer push cancels it): its half-run tests are not failures (F3, tools/ui_flake_log.sh).
      - if: always() && !cancelled()
        name: Flake log
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ui_flake_log.sh out "faults API 35"

  # Phase 11 T8: the RELEASE apk, signed in the job with a keystore made by keytool (never committed, never a secret), on an API 35
  # emulator with the network off: badging, no uitest classes, a monkey, and the cold-start gate (startup-baseline.json). 0 requests.
  release-smoke:
    name: release APK smoke + startup on API 35
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, issues: write } # issues: the flake log step only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Throwaway keystore + signed release APK
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke -keyalg RSA -keysize 2048 -validity 30 \
            -storepass smoke-pass -keypass smoke-pass -dname "CN=release smoke, O=ci"
          RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/smoke.jks" RELEASE_KEYSTORE_PASSWORD=smoke-pass RELEASE_KEY_ALIAS=smoke RELEASE_KEY_PASSWORD=smoke-pass \
            RELEASE_VERSION=9.9.9 ./gradlew -p android :app:assembleRelease -PsmokeAbi=x86_64
          mkdir apks && cp android/app/build/outputs/apk/release/app-release.apk apks/
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs apks/app-release.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: sysimg-35-google_apis-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ui_release_run.sh apks/app-release.apk out/release-smoke 9.9.9 90909
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke
          path: out/
          retention-days: 7
      # Not for a cancelled job (a newer push cancels it): its half-run tests are not failures (F3, tools/ui_flake_log.sh).
      - if: always() && !cancelled()
        name: Flake log
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ui_flake_log.sh out "release smoke API 35"

  report:
    name: report → ci-screens
    needs: [build, layout, behaviour]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: "[lb]*" }
      - run: pip install --quiet pillow
      - name: Build the report
        run: |
          python3 tools/ui_report.py art site --title "UI tests — ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" | tee summary.txt
          cat site/README.md >> "$GITHUB_STEP_SUMMARY"
      # One commit, force-pushed: the branch always holds only the latest run, so the repo
      # does not grow. Pushes made with GITHUB_TOKEN do not trigger other workflows.
      - name: Publish to the ci-screens branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI test screens: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
