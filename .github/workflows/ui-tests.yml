# The app on emulators: every screen on 9 phone profiles (size, density, font scale,
# Hebrew/English, light/dark, nav mode, cutout, landscape) with a layout audit, and the
# user journeys on Android 8, 10, 13, 14 and 15. The `uitest` build answers from recorded
# fixtures, so this sends nothing to Transitous or OpenFreeMap.
#
# Free: standard GitHub-hosted runners (public repo). Never switch to "larger runners".
# Results: the `ci-screens` branch (README.md = findings, screens.md = every screenshot).
# See .claude/skills/ui-testing.
name: UI tests

on:
  push:
    branches-ignore: [ci-screens]
    paths:
      - "android/**"
      - "core/src/main/**"
      - "core/src/test/resources/fixtures/**"
      - "gradle/**"
      - "tools/ui_*"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/src/main/**"
      - "core/src/test/resources/fixtures/**"
      - "gradle/**"
      - "tools/ui_*"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build uitest APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p android :app:assembleUitest :app:assembleUitestAndroidTest
      - run: |
          mkdir apks
          cp android/app/build/outputs/apk/uitest/app-uitest.apk apks/
          cp android/app/build/outputs/apk/androidTest/uitest/app-uitest-androidTest.apk apks/
      - uses: actions/upload-artifact@v4
        with: { name: uitest-apks, path: apks/, retention-days: 3 }

  layout:
    name: screens on phone profiles (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A screen big enough for every profile: wm size only shrinks it (tools/ui_layout_run.sh).
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 2400x2400
          script: bash tools/ui_layout_run.sh ${{ matrix.shard }} apks out/layout-${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-${{ matrix.shard }}
          path: out/
          retention-days: 7

  behaviour:
    name: journeys on API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 33, 34, 35]
        # Android 8 runs the plain AOSP image (lighter). Its SystemUI crash over the lock
        # screen is handled in tools/ui_behaviour_run.sh.
        target: [google_apis]
        exclude:
          - api: 26
            target: google_apis
        include:
          - api: 26
            target: default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: uitest-apks, path: apks }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ui_behaviour_run.sh ${{ matrix.api }} apks out/behaviour-${{ matrix.api }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behaviour-${{ matrix.api }}
          path: out/
          retention-days: 7

  report:
    name: report → ci-screens
    needs: [build, layout, behaviour]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: "[lb]*" }
      - run: pip install --quiet pillow
      - name: Build the report
        run: |
          python3 tools/ui_report.py art site --title "UI tests — ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" | tee summary.txt
          cat site/README.md >> "$GITHUB_STEP_SUMMARY"
      # One commit, force-pushed: the branch always holds only the latest run, so the repo
      # does not grow. Pushes made with GITHUB_TOKEN do not trigger other workflows.
      - name: Publish to the ci-screens branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI test screens: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}, run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
