name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core tests + docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p core test
      - run: python3 tools/check_docs.py
      - run: python3 tools/check_strings.py

  android:
    name: build debug APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p android :app:assembleDebug
      # The UI-test app + its tests (run on emulators by ui-tests.yml); here only built.
      - run: ./gradlew -p android :app:assembleUitest :app:assembleUitestAndroidTest
      # Unsigned here (no secrets in CI): only proves the release build compiles.
      - run: ./gradlew -p android :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
