name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core tests + docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # ktlint_gate.py diffs against the merge-base with main
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p core test
      # Phase 11 T1: line coverage of core, gated (the value is in core/build.gradle.kts; it only ratchets up).
      - run: ./gradlew -p core koverXmlReport koverVerify
      - name: coverage per package
        if: always()
        run: python3 tools/kover_summary.py >> "$GITHUB_STEP_SUMMARY"
      - run: python3 tools/check_docs.py
      - run: python3 tools/check_strings.py
      # The flake log skips a cancelled job (dry run, no network).
      - run: bash tools/test_flake_log.sh
      # Phase 11 T5: the contract shapes are generated from the fixtures; a fixture change must regenerate them.
      - run: python3 tools/contract_check.py --check-shapes
      # Phase 11 T2: style. ktlint lists every finding; the gate fails on lines this change added or edited.
      - run: ./gradlew -p core ktlintCheck
      - name: ktlint on changed lines
        run: python3 tools/ktlint_gate.py | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" = 0

  mutation:
    # Phase 11 T5 (owner decision 20): PIT on the core classes this PR changed; fails a class that scores more
    # than 2 points under core/mutation-baseline.json. Skipped (no Gradle, no PIT) unless core/src/main changed.
    name: mutation (changed classes)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Changed classes
        id: changed
        run: echo "classes=$(python3 tools/mutation_score.py changed "origin/${{ github.base_ref }}")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.classes != ''
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        if: steps.changed.outputs.classes != ''
      # Incremental history: mutants of unchanged code that were killed are not re-run.
      - uses: actions/cache@v4
        if: steps.changed.outputs.classes != ''
        with:
          path: core/build/pit-history
          key: pit-history-${{ github.run_id }}
          restore-keys: pit-history-
      - name: PIT on the changed classes
        if: steps.changed.outputs.classes != ''
        run: ./gradlew -p core pitest "-PpitClasses=${{ steps.changed.outputs.classes }}" --console=plain
      - name: Gate
        if: steps.changed.outputs.classes != ''
        run: python3 tools/mutation_score.py gate core/build/reports/pitest/mutations.xml --only "${{ steps.changed.outputs.classes }}" | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" = 0
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.classes != ''
        with: { name: pitest-changed, path: core/build/reports/pitest, retention-days: 14 }

  android:
    name: build debug APK
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p android :app:assembleDebug
      # The UI-test app + its tests (run on emulators by ui-tests.yml); here only built.
      - run: ./gradlew -p android :app:assembleUitest :app:assembleUitestAndroidTest
      # Unsigned here (no secrets in CI): only proves the release build compiles.
      - run: ./gradlew -p android :app:assembleRelease
      # Phase 11 T2 gates (android-build skill): Lint, ktlint on changed lines, APK size.
      - name: Android Lint
        run: ./gradlew -p android :app:lintDebug
      - name: Lint counts
        if: always()
        run: python3 tools/lint_summary.py android/app/build/reports/lint-results-debug.xml >> "$GITHUB_STEP_SUMMARY"
      - run: ./gradlew -p android :app:ktlintCheck
      - name: ktlint on changed lines
        run: python3 tools/ktlint_gate.py | tee -a "$GITHUB_STEP_SUMMARY"; test "${PIPESTATUS[0]}" = 0
      - name: APK size
        run: python3 tools/apk_size.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  screenshots:
    name: screenshots (Paparazzi)
    needs: core
    runs-on: ubuntu-latest
    # Only this job may write, and only to the `screenshots` branch (step below).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      # Regression check: compare against the goldens committed in src/test/snapshots/images.
      # A changed picture, or a shot with no golden, fails the job at the end; the steps in
      # between still record and publish the new pictures, which is how a PR re-records
      # (`python3 tools/pull_goldens.py`, see the android-build skill).
      - name: verify goldens
        id: verify
        continue-on-error: true
        run: ./gradlew -p android :app:verifyPaparazziDebug
      # verifyPaparazziDebug runs EVERY unit test of the app, so a red verify is not always a picture:
      # a ViewModel test failing there was reported as "Screenshots differ" (runs 39490612517, 41223364248;
      # Phase 11 F2). Sort the failures by class: a class that renders with Paparazzi is a golden, any
      # other is a unit test, named as such. Read now: the record step overwrites the results.
      - name: what failed in verify
        id: verdict
        if: steps.verify.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, xml.etree.ElementTree as ET
          shots = {p.stem for p in pathlib.Path("android/app/src/test").rglob("*.kt") if "Paparazzi(" in p.read_text()}
          golden, other = [], []
          for f in glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  bad = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if bad is None: continue
                  cls = case.get("classname", "").rsplit(".", 1)[-1].split("$")[0]
                  line = f"{case.get('classname')} > {case.get('name')}: {(bad.get('message') or '').splitlines()[0][:200] if bad.get('message') else ''}"
                  (golden if cls in shots else other).append(line)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"golden={len(golden)}\nother={len(other)}\n")
          for l in golden: print(f"::error::golden: {l}")
          for l in other: print(f"::error::unit test (not a golden): {l}")
          PY
      # Fresh pictures for looking at (and for re-recording): light/dark, he/en, every shape.
      - run: ./gradlew -p android :app:recordPaparazziDebug
      # Phase 11 T3: the ViewModel / state tests (ui/vm/ and the other plain-JVM ones) under Kover; line coverage
      # of ui/ without the Compose screens is gated (minValue in android/app/build.gradle.kts; it only ratchets up).
      - name: ViewModel tests + Android coverage
        if: always()
        run: >
          ./gradlew -p android :app:testDebugUnitTest
          --tests 'il.transit.planner.ui.vm.*' --tests '*ViewModelTest' --tests '*SavedUi*Test'
          :app:koverXmlReportDebug :app:koverVerifyDebug
      - name: Android coverage per package
        if: always()
        run: python3 tools/kover_summary.py android/app/build/reports/kover/reportDebug.xml "app ui/ line coverage (Kover)" il/transit/planner/ | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            android/app/src/test/snapshots/
            android/app/build/paparazzi/failures/
          retention-days: 14
      # Also onto the `screenshots` branch, one folder per source branch: artifact storage
      # is unreachable from a cloud Claude session, raw.githubusercontent.com is not. The
      # branch is always ONE parentless commit, so it never grows. Pushes only (a fork's
      # pull request has a read-only token).
      - name: publish to the screenshots branch
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="${BRANCH//\//_}"
          wt="$RUNNER_TEMP/shots"
          # Two branches finishing at once lose the lease race; the second try re-reads.
          for attempt in 1 2; do
            git worktree remove --force "$wt" 2>/dev/null || true
            if git fetch -q --depth=1 origin screenshots 2>/dev/null; then
              lease="screenshots:$(git rev-parse FETCH_HEAD)"
              git worktree add -q --detach "$wt" FETCH_HEAD
            else
              lease="screenshots:"   # must not exist yet
              git worktree add -q --detach "$wt"
              git -C "$wt" rm -rfq --ignore-unmatch .
            fi
            rm -rf "${wt:?}/$dir" && mkdir -p "$wt/$dir"
            cp android/app/src/test/snapshots/images/*.png "$wt/$dir/"
            # What the verify step saw differ (golden | new | diff), when it failed.
            if ls android/app/build/paparazzi/failures/delta-*.png >/dev/null 2>&1; then
              mkdir -p "$wt/$dir/failures" && cp android/app/build/paparazzi/failures/delta-*.png "$wt/$dir/failures/"
            fi
            printf 'commit %s\nrun %s\n' "$GITHUB_SHA" "$RUN_URL" > "$wt/$dir/INFO.txt"
            git -C "$wt" add -A
            commit=$(git -C "$wt" commit-tree "$(git -C "$wt" write-tree)" -m "Screenshots ($BRANCH @ ${GITHUB_SHA::7})")
            if git push -q --force-with-lease="$lease" origin "$commit:refs/heads/screenshots"; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: fail if a golden changed
        if: steps.verify.outcome == 'failure' && steps.verdict.outputs.other == '0' && steps.verdict.outputs.golden != '0'
        run: |
          echo "::error::Screenshots differ from the committed goldens (or a shot has none)."
          echo "If the change is intended, re-record in this PR: python3 tools/pull_goldens.py, then commit."
          exit 1
      - name: fail if a unit test failed in verify
        if: steps.verify.outcome == 'failure' && steps.verdict.outputs.other != '0'
        run: |
          echo "::error::${{ steps.verdict.outputs.other }} unit test(s) failed in the verify step (listed in 'what failed in verify'); ${{ steps.verdict.outputs.golden }} golden(s) differ."
          exit 1
      - name: fail if verify failed without a failing test
        if: steps.verify.outcome == 'failure' && steps.verdict.outputs.other == '0' && steps.verdict.outputs.golden == '0'
        run: |
          echo "::error::verifyPaparazziDebug failed before any test result (a build error?): read the 'verify goldens' log."
          exit 1
