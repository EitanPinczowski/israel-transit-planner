# Phase 11 T8: does an update keep everything? The latest release's `uitest` APK is installed, given that version's saved-data sample
# (T1) and launched so it arms its night refresh and leave reminder; then HEAD's `uitest` APK goes over it with `adb install -r`.
# UpgradeProbe logs places, Home/Work, saved trips, routines, My lines, history, settings, the reminder, the night refresh and the
# channels; any loss fails (tools/ui_upgrade_run.sh, tools/upgrade_data.py). Both APKs are signed with the job's own debug key.
# release.yml does the real-APK version of the install check before it publishes. 0 requests. See .claude/skills/ui-testing.
name: Upgrade test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0" # weekly, Sunday 07:23 Israel summer time
  pull_request:
    paths:
      - "core/src/main/**/user/**"
      - "core/src/main/**/history/**"
      - "android/**/data/**"
      - "android/app/src/main/AndroidManifest.xml"
      - "android/app/build.gradle.kts"
      - "tools/ui_upgrade_run.sh"
      - "tools/upgrade_data.py"
      - ".github/workflows/upgrade.yml"

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upgrade:
    name: latest release -> HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: The latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$tag" ] || { echo "::error::no release yet"; exit 1; }
          sample="core/src/test/resources/fixtures/userdata/${tag#v}.json"
          [ -f "$sample" ] || { echo "::error::no saved-data sample for $tag ($sample): run tools/gen_userdata_sample.sh $tag (skill release-apk)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sample=$sample" >> "$GITHUB_OUTPUT"
          echo "Upgrading from $tag"
      # The old build: the release tag's own source, with its own version number.
      - name: Build the old uitest APK
        run: |
          git worktree add "$RUNNER_TEMP/old" "${{ steps.rel.outputs.tag }}"
          RELEASE_VERSION="${{ steps.rel.outputs.tag }}" ./gradlew -p "$RUNNER_TEMP/old/android" :app:assembleUitest
          mkdir apks && cp "$RUNNER_TEMP/old/android/app/build/outputs/apk/uitest/app-uitest.apk" apks/old.apk
      # HEAD, with a higher version code so the install is a real upgrade (a dev build has code 1).
      - name: Build HEAD's uitest APK
        run: |
          RELEASE_VERSION=99.0.0 ./gradlew -p android :app:assembleUitest
          cp android/app/build/outputs/apk/uitest/app-uitest.apk apks/new.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator system image
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: sysimg-35-google_apis-x86_64-v1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ui_upgrade_run.sh apks/old.apk apks/new.apk ${{ steps.rel.outputs.sample }} out/upgrade
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: upgrade, path: out/, retention-days: 7 }
