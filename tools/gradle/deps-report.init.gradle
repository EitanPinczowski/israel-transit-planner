// Lists the resolved dependencies of the release APK and of the tests (Phase 11 T2). Used by
// .github/workflows/deps.yml:  ./gradlew -p android -I tools/gradle/deps-report.init.gradle depsReport
// Writes <project>/build/deps/gradle.lockfile  (group:artifact:version=configs, what OSV-scanner reads)
//        <project>/build/deps/runtime.tsv      (coordinate <TAB> pom file, release runtime only)
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

allprojects {
    tasks.register('depsReport') {
        doLast {
            def names = ['releaseRuntimeClasspath', 'debugUnitTestRuntimeClasspath', 'runtimeClasspath', 'testRuntimeClasspath']
            def runtimeNames = ['releaseRuntimeClasspath', 'runtimeClasspath']
            def versions = new TreeMap<String, Set<String>>()
            def runtime = new TreeSet<ModuleComponentIdentifier>({ a, b -> a.toString() <=> b.toString() } as Comparator)
            names.each { n ->
                def cfg = project.configurations.findByName(n)
                if (cfg == null || !cfg.canBeResolved) return
                cfg.incoming.resolutionResult.allComponents.each { c ->
                    def id = c.id
                    if (id instanceof ModuleComponentIdentifier) {
                        versions.computeIfAbsent("${id.group}:${id.module}:${id.version}".toString(), { new TreeSet<String>() }).add(n)
                        if (n in runtimeNames) runtime.add(id)
                    }
                }
            }
            def dir = new File(project.buildDir, 'deps')
            dir.mkdirs()
            new File(dir, 'gradle.lockfile').text = versions.collect { k, v -> "${k}=${v.join(',')}" }.join('\n') + '\n'
            def rows = []
            if (!runtime.isEmpty()) {
                def res = project.dependencies.createArtifactResolutionQuery()
                        .forComponents(runtime as List)
                        .withArtifacts(MavenModule, MavenPomArtifact)
                        .execute()
                res.resolvedComponents.each { comp ->
                    comp.getArtifacts(MavenPomArtifact).each { a ->
                        if (a instanceof ResolvedArtifactResult) rows << "${comp.id}\t${a.file}"
                    }
                }
            }
            new File(dir, 'runtime.tsv').text = rows.sort().join('\n') + '\n'
            println "depsReport ${project.path}: ${versions.size()} components, ${rows.size()} runtime poms"
        }
    }
}
